playServicesLocation = "21.4.0"
serialization = "1.12.0"
coroutines = "1.11.0"
junit = "4.13.2"
osmdroid = "6.1.20"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core" }
